<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="One install gives an AI coding assistant two things: workflows you invoke by name, such as slash office-hours, slash review and slash ship, and standing rules that are always on. Both land in Claude Code, Cursor, Kiro and Codex CLI.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#121A2A"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB950"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#BC8CFF"/>
    </linearGradient>
    <linearGradient id="wireflat" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FB950"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#BC8CFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="320" rx="14" fill="url(#bg)"/>

  <!-- left column: what you invoke -->
  <text x="48" y="52" fill="#7D8590" font-size="12" letter-spacing="1.6">WHAT YOU INVOKE</text>
  <g font-size="14" fill="#E6EDF3">
    <rect x="44" y="66" width="188" height="34" rx="8" fill="#161B22" stroke="#3FB950" stroke-opacity="0.55"/>
    <text x="60" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/office-hours</text>
    <rect x="44" y="108" width="188" height="34" rx="8" fill="#161B22" stroke="#58A6FF" stroke-opacity="0.55"/>
    <text x="60" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/review</text>
    <rect x="44" y="150" width="188" height="34" rx="8" fill="#161B22" stroke="#BC8CFF" stroke-opacity="0.55"/>
    <text x="60" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/ship</text>
  </g>
  <text x="48" y="208" fill="#7D8590" font-size="12">60 workflows, one file each</text>

  <!-- right column: what is always on -->
  <text x="648" y="52" fill="#7D8590" font-size="12" letter-spacing="1.6">ALWAYS ON</text>
  <g font-size="13" fill="#E6EDF3">
    <rect x="644" y="66" width="192" height="34" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="660" y="88">Plans before it codes</text>
    <rect x="644" y="108" width="192" height="34" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="660" y="130">Reviews its own diff</text>
    <rect x="644" y="150" width="192" height="34" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="660" y="172">Commits in your voice</text>
  </g>
  <text x="648" y="208" fill="#7D8590" font-size="12">13 rules, ~3.9% of context</text>

  <!-- centre: the assistant -->
  <g filter="url(#glow)">
    <circle cx="440" cy="124" r="58" fill="#161B22" stroke="url(#wire)" stroke-width="2"/>
  </g>
  <text x="440" y="118" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="600">your</text>
  <text x="440" y="138" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="600">assistant</text>

  <!-- wires in -->
  <path d="M232 124 H382" stroke="url(#wireflat)" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M644 124 H498" stroke="url(#wireflat)" stroke-width="2" fill="none" opacity="0.8"/>
  <circle cx="382" cy="124" r="3" fill="#58A6FF"/>
  <circle cx="498" cy="124" r="3" fill="#BC8CFF"/>

  <!-- one install -->
  <path d="M440 182 V214" stroke="#30363D" stroke-width="2"/>
  <rect x="368" y="214" width="144" height="32" rx="8" fill="#0D1117" stroke="url(#wire)" stroke-width="1.5"/>
  <text x="440" y="235" text-anchor="middle" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">./install</text>

  <!-- runtimes -->
  <g font-size="12" fill="#7D8590">
    <text x="440" y="274" text-anchor="middle">Claude Code &#183; Cursor &#183; Kiro &#183; Codex CLI</text>
    <text x="440" y="296" text-anchor="middle" fill="#57606A">one source, no lock-in, nothing leaves your machine</text>
  </g>
</svg>
