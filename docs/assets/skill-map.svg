<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The sixty vibestack skills grouped into six families: shape and plan, build and debug, review, AWS and AI, ship, and guard and drive. Each family lists the commands you type most.">
  <defs>
    <linearGradient id="mapbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#121A2A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="880" height="400" rx="18" fill="url(#mapbg)"/>

  <text x="40" y="50" fill="#E6EDF3" font-size="22" font-weight="700">60 skills, six jobs</text>
  <text x="40" y="72" fill="#7D8590" font-size="13" font-weight="500">one source, four runtimes — the commands you reach for most, per stage</text>

  <!-- row 1 -->
  <g>
    <rect x="40" y="98" width="256" height="128" rx="12" fill="#0E1626" stroke="#3FB950" stroke-width="1.5" opacity="0.7"/>
    <text x="60" y="124" fill="#3FB950" font-size="11" font-weight="700" letter-spacing="1">SHAPE &amp; PLAN</text>
    <text x="60" y="148" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/office-hours</text>
    <text x="60" y="170" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/spec</text>
    <text x="60" y="192" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/plan-eng-review</text>
    <text x="60" y="212" fill="#7D8590" font-size="11">+ ceo, design, devex, autoplan</text>
  </g>

  <g>
    <rect x="312" y="98" width="256" height="128" rx="12" fill="#0E1626" stroke="#58A6FF" stroke-width="1.5" opacity="0.7"/>
    <text x="332" y="124" fill="#58A6FF" font-size="11" font-weight="700" letter-spacing="1">BUILD &amp; DEBUG</text>
    <text x="332" y="148" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/investigate</text>
    <text x="332" y="170" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/health</text>
    <text x="332" y="192" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/learn</text>
    <text x="332" y="212" fill="#7D8590" font-size="11">root cause first, then the fix</text>
  </g>

  <g>
    <rect x="584" y="98" width="256" height="128" rx="12" fill="#0E1626" stroke="#BC8CFF" stroke-width="1.5" opacity="0.7"/>
    <text x="604" y="124" fill="#BC8CFF" font-size="11" font-weight="700" letter-spacing="1">REVIEW</text>
    <text x="604" y="148" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/review</text>
    <text x="604" y="170" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/codex</text>
    <text x="604" y="192" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/cso</text>
    <text x="604" y="212" fill="#7D8590" font-size="11">two models have to agree</text>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="40" y="242" width="256" height="128" rx="12" fill="#0E1626" stroke="#F0883E" stroke-width="1.5" opacity="0.7"/>
    <text x="60" y="268" fill="#F0883E" font-size="11" font-weight="700" letter-spacing="1">AWS &amp; AI</text>
    <text x="60" y="292" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/aws-cost</text>
    <text x="60" y="314" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/bedrock-guardrails</text>
    <text x="60" y="336" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/connect-review</text>
    <text x="60" y="356" fill="#7D8590" font-size="11">+ kb-review, agent-eval, ai-cost-guard</text>
  </g>

  <g>
    <rect x="312" y="242" width="256" height="128" rx="12" fill="#0E1626" stroke="#3FB950" stroke-width="1.5" opacity="0.7"/>
    <text x="332" y="268" fill="#3FB950" font-size="11" font-weight="700" letter-spacing="1">SHIP</text>
    <text x="332" y="292" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/ship</text>
    <text x="332" y="314" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/address-pr-review</text>
    <text x="332" y="336" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/land-and-deploy</text>
    <text x="332" y="356" fill="#7D8590" font-size="11">+ document-release, unslop</text>
  </g>

  <g>
    <rect x="584" y="242" width="256" height="128" rx="12" fill="#0E1626" stroke="#58A6FF" stroke-width="1.5" opacity="0.7"/>
    <text x="604" y="268" fill="#58A6FF" font-size="11" font-weight="700" letter-spacing="1">GUARD &amp; DRIVE</text>
    <text x="604" y="292" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/careful</text>
    <text x="604" y="314" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/freeze</text>
    <text x="604" y="336" fill="#E6EDF3" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/browse</text>
    <text x="604" y="356" fill="#7D8590" font-size="11">hooks that stop the bad command</text>
  </g>
</svg>
